<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIKTOK DOWNLOADER | by ZAID ASHIQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Montserrat:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary-color: #ff0000;
            --secondary-color: #ff3333;
            --accent-color: #cc0000;
            --dark-bg: #0a0a0a;
            --darker-bg: #000000;
            --text-glow: #ff0000;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--darker-bg) 0%, var(--dark-bg) 100%);
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Orbitron', sans-serif;
        }
        
        .glow {
            text-shadow: 0 0 10px var(--text-glow), 0 0 20px var(--text-glow), 0 0 30px var(--text-glow);
        }
        
        .btn-glow {
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
            transition: all 0.3s ease;
        }
        
        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.9), 0 0 30px rgba(255, 0, 0, 0.5);
            transform: translateY(-2px);
        }
        
        .social-btn {
            transition: all 0.3s ease;
        }
        
        .social-btn:hover {
            transform: translateY(-3px);
        }
        
        .result-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 0, 0, 0.2);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.1);
        }
        
        .loading-spinner {
            border-top-color: var(--primary-color);
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .floating {
            animation: floating 3s ease-in-out infinite;
        }
        
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .popup-content {
            background: linear-gradient(135deg, var(--darker-bg) 0%, #1a0000 100%);
            border: 2px solid var(--primary-color);
            border-radius: 15px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
        }
        
        .popup-overlay.active .popup-content {
            transform: scale(1);
        }
        
        .close-popup {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .close-popup:hover {
            color: var(--primary-color);
            transform: rotate(90deg);
        }
        
        .channel-link {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }
        
        .channel-link:hover {
            background: var(--secondary-color);
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.7);
        }
        
        .icon-container {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .icon-item {
            width: 60px;
            height: 60px;
            background: var(--dark-bg);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        
        .icon-item:hover {
            background: var(--primary-color);
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
        }
        
        .icon-item:nth-child(1) {
            animation: floating 3s ease-in-out infinite;
        }
        
        .icon-item:nth-child(2) {
            animation: floating 3s ease-in-out infinite 0.5s;
        }
        
        .icon-item:nth-child(3) {
            animation: floating 3s ease-in-out infinite 1s;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo-icon {
            width: 50px;
            height: 50px;
            background: var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            animation: pulse 2s infinite;
        }
        
        .custom-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
            animation: pulse 2s infinite;
        }
        
        .whatsapp-channel-btn {
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
        }
        
        .whatsapp-channel-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }
        
        .channel-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        
        @media (min-width: 768px) {
            .channel-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .icon-container {
                position: static;
                flex-direction: row;
                justify-content: center;
                margin-bottom: 2rem;
                transform: none;
            }
        }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="text-center mb-10">
            <div class="logo justify-center mb-4">
                <img src="img.png" alt="ZAID ASHIQ Logo" class="custom-logo">
                <h1 class="text-4xl font-bold glow">ZAID ASHIQ TIKTOK DOWNLOADER</h1>
            </div>
            <p class="text-gray-300">Download TikTok videos without watermark in high quality</p>
        </header>

        <!-- Search Bar -->
        <div class="max-w-2xl mx-auto mb-10">
            <div class="flex flex-col md:flex-row gap-4">
                <input 
                    type="text" 
                    id="tiktok-url" 
                    placeholder="Paste TikTok video URL here..." 
                    class="whatsapp-channel-btn">
                <button 
                    id="download-btn" 
                    class="whatsapp-channel-btn">
                    <i class="fas fa-download mr-2"></i> Download
                </button>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden flex justify-center mb-10">
            <div class="loading-spinner h-12 w-12 border-4 border-red-500 rounded-full"></div>
        </div>

        <!-- Results Section -->
        <div id="results" class="hidden max-w-2xl mx-auto mb-10">
            <div class="result-card rounded-xl p-6 mb-6">
                <div class="flex flex-col md:flex-row gap-6">
                    <div class="md:w-1/3">
                        <img id="video-thumbnail" src="" alt="Video thumbnail" class="w-full rounded-lg">
                    </div>
                    <div class="md:w-2/3">
                        <h2 id="video-title" class="text-xl font-bold mb-2"></h2>
                        <p id="video-author" class="text-gray-400 mb-4"></p>
                        <div class="flex flex-wrap gap-3 mb-4">
                            <span id="video-plays" class="px-3 py-1 bg-gray-800 rounded-full text-sm"></span>
                            <span id="video-likes" class="px-3 py-1 bg-gray-800 rounded-full text-sm"></span>
                            <span id="video-comments" class="px-3 py-1 bg-gray-800 rounded-full text-sm"></span>
                            <span id="video-shares" class="px-3 py-1 bg-gray-800 rounded-full text-sm"></span>
                        </div>
                        <div class="flex flex-col sm:flex-row gap-3">
                            <a id="download-no-watermark" class="whatsapp-channel-btn">
                                <i class="fas fa-file-video mr-2"></i> No Watermark
                            </a>
                            <a id="download-with-watermark" class="whatsapp-channel-btn">
                                <i class="fas fa-file-video mr-2"></i> With Watermark
                            </a>
                            <a id="download-music" class="whatsapp-channel-btn">
                                <i class="fas fa-music mr-2"></i> Music Only
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Footer -->
        <footer class="text-center text-gray-500 text-sm mt-12">
            <p>© 2025 ZAID ASHIQ... TIKTOK DOWNLOADER. All rights reserved.</p>
            <p class="mt-1">Developed by <span class="text-red-400">DANISH RASOOL</span></p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const downloadBtn = document.getElementById('download-btn');
            const tiktokUrl = document.getElementById('tiktok-url');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const popup = document.getElementById('popup');
            const closePopup = document.getElementById('close-popup');
            const whatsapp1Icon = document.getElementById('whatsapp1-icon');
            const whatsapp2Icon = document.getElementById('whatsapp2-icon');
            const infoIcon = document.getElementById('info-icon');
            
            // Video elements
            const videoTitle = document.getElementById('video-title');
            const videoAuthor = document.getElementById('video-author');
            const videoThumbnail = document.getElementById('video-thumbnail');
            const videoPlays = document.getElementById('video-plays');
            const videoLikes = document.getElementById('video-likes');
            const videoComments = document.getElementById('video-comments');
            const videoShares = document.getElementById('video-shares');
            const downloadNoWatermark = document.getElementById('download-no-watermark');
            const downloadWithWatermark = document.getElementById('download-with-watermark');
            const downloadMusic = document.getElementById('download-music');

            // Show popup on page load
            setTimeout(() => {
                popup.classList.add('active');
            }, 2000);

            // Close popup
            closePopup.addEventListener('click', function() {
                popup.classList.remove('active');
            });

            // Close popup when clicking outside
            popup.addEventListener('click', function(e) {
                if (e.target === popup) {
                    popup.classList.remove('active');
                }
            });

            infoIcon.addEventListener('click', function() {
                alert('Zaid Ashiq TIKTOK DOWNLOADER\n\nDownload TikTok videos without watermark in high quality.\n\nDeveloped by Danish Rasool');
            });

            downloadBtn.addEventListener('click', async function() {
                const url = tiktokUrl.value.trim();
                
                if (!url) {
                    alert('Please enter a TikTok video URL');
                    return;
                }
                
                if (!url.includes('tiktok.com')) {
                    alert('Please enter a valid TikTok video URL');
                    return;
                }
                
                try {
                    // Show loading, hide results
                    loading.classList.remove('hidden');
                    results.classList.add('hidden');
                    
                    // Fetch data from API
                    const response = await fetch(`https://tikwm.com/api/?url=${encodeURIComponent(url)}`);
                    const data = await response.json();
                    
                    if (data.code !== 0) {
                        throw new Error(data.msg || 'Failed to fetch video data');
                    }
                    
                    // Populate the results
                    videoTitle.textContent = data.data.title || 'Untitled';
                    videoAuthor.textContent = `By ${data.data.author.nickname || 'Unknown'}`;
                    videoThumbnail.src = data.data.cover;
                    
                    // Format numbers
                    videoPlays.textContent = `👀 ${formatNumber(data.data.play_count)}`;
                    videoLikes.textContent = `❤️ ${formatNumber(data.data.digg_count)}`;
                    videoComments.textContent = `💬 ${formatNumber(data.data.comment_count)}`;
                    videoShares.textContent = `↗️ ${formatNumber(data.data.share_count)}`;
                    
                    // Set download links
                    downloadNoWatermark.href = data.data.play;
                    downloadNoWatermark.setAttribute('download', 'tiktok_video_no_watermark.mp4');
                    
                    downloadWithWatermark.href = data.data.wmplay;
                    downloadWithWatermark.setAttribute('download', 'tiktok_video_with_watermark.mp4');
                    
                    downloadMusic.href = data.data.music;
                    downloadMusic.setAttribute('download', 'tiktok_music.mp3');
                    
                    // Hide loading, show results
                    loading.classList.add('hidden');
                    results.classList.remove('hidden');
                    
                } catch (error) {
                    loading.classList.add('hidden');
                    alert('Error: ' + error.message);
                    console.error(error);
                }
            });
            
            function formatNumber(num) {
                if (num >= 1000000) {
                    return (num / 1000000).toFixed(1) + 'M';
                }
                if (num >= 1000) {
                    return (num / 1000).toFixed(1) + 'K';
                }
                return num;
            }
        });
    </script>
</body>
  </html>
